<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fff5f5"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0033"/>
      <stop offset="100%" style="stop-color:#ff6600"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0033"/>
      <stop offset="100%" style="stop-color:#cc0029"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6600"/>
      <stop offset="100%" style="stop-color:#ff4500"/>
    </linearGradient>
  </defs>
  <!-- White background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#circuitGrad)" stroke-width="8"/>
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.3"/>
  <!-- Circuit traces in red-orange -->
  <g opacity="0.2" stroke="url(#circuitGrad)" stroke-width="2.5" fill="none">
    <path d="M80 256 H120 L140 236 H180"/>
    <path d="M332 236 H372 L392 256 H432"/>
    <path d="M256 80 V120 L236 140 V180"/>
    <path d="M256 332 V372 L276 392 V432"/>
    <circle cx="180" cy="236" r="4" fill="#ff6600"/>
    <circle cx="332" cy="236" r="4" fill="#ff6600"/>
    <circle cx="256" cy="180" r="4" fill="#ff6600"/>
    <circle cx="256" cy="332" r="4" fill="#ff6600"/>
    <circle cx="432" cy="256" r="4" fill="#ff6600"/>
    <circle cx="80" cy="256" r="4" fill="#ff6600"/>
  </g>
  <!-- Additional tech nodes -->
  <g opacity="0.15" stroke="#ff0033" stroke-width="1.5" fill="none">
    <path d="M120 120 L150 150"/>
    <path d="M362 120 L392 150"/>
    <path d="M120 392 L150 362"/>
    <path d="M362 392 L392 362"/>
  </g>
  <!-- Apple icon -->
  <g transform="translate(256,230) scale(1)">
    <path d="M0-60 C-15-60,-30-50,-30-30 C-30-15,-20-5,-10 5 C-20 15,-25 30,-25 45 C-25 70,-10 90,10 90 C15 90,20 85,25 80 C30 75,35 70,40 70 C45 70,50 75,55 80 C60 85,65 90,70 90 C90 90,105 70,105 45 C105 30,100 15,90 5 C80-5,70-15,70-30 C70-50,85-60,85-60 C70-65,55-55,45-40 C40-35,35-30,30-25 C25-30,20-35,15-40 C5-55,-10-65,0-60Z" fill="url(#appleGrad)"/>
    <ellipse cx="-5" cy="-25" rx="8" ry="12" fill="#ff6600" opacity="0.4" transform="rotate(-20,-5,-25)"/>
  </g>
  <!-- Gear/Repair wrench icon -->
  <g transform="translate(256,320)" fill="url(#wrenchGrad)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#wrenchGrad)" stroke-width="4"/>
    <rect x="-4" y="-40" width="8" height="80" rx="4" fill="url(#wrenchGrad)"/>
    <rect x="-40" y="-4" width="80" height="8" rx="4" fill="url(#wrenchGrad)"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
  </g>
  <!-- Tech dots -->
  <circle cx="256" cy="130" r="3" fill="#ff6600" opacity="0.8"/>
  <circle cx="256" cy="382" r="3" fill="#ff6600" opacity="0.8"/>
  <circle cx="130" cy="256" r="3" fill="#ff6600" opacity="0.8"/>
  <circle cx="382" cy="256" r="3" fill="#ff6600" opacity="0.8"/>
  <!-- Small orange accent dots -->
  <circle cx="180" cy="130" r="2" fill="#ff6600" opacity="0.6"/>
  <circle cx="332" cy="130" r="2" fill="#ff6600" opacity="0.6"/>
  <circle cx="130" cy="332" r="2" fill="#ff6600" opacity="0.6"/>
  <circle cx="382" cy="332" r="2" fill="#ff6600" opacity="0.6"/>
</svg>